[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loreto-mcp"
version = "0.3.0"
description = "MCP server for Loreto: generate Claude Code skills from any source AND publish/discover/buy them on the Loreto skills marketplace (Stripe or x402/USDC) — inside any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["loreto", "mcp", "skills", "claude", "ai", "model-context-protocol", "marketplace", "x402"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
loreto-mcp = "loreto_mcp.server:main"

[project.urls]
Homepage = "https://loreto.io"
Documentation = "https://loreto.io/docs-mcp"
Repository = "https://github.com/kopias/loreto-mcp"

[tool.hatch.build.targets.wheel]
packages = ["loreto_mcp"]
