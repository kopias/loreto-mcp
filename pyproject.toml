[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loreto-mcp"
version = "1.3.0"
description = "Free harnesses for open models in Claude Code, OpenCode, Codex, Hermes and DeepSeek: break the loop, keep the model moving, hold it to your checks. Plus a $5 harness tuned to your own repository."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["loreto", "mcp", "harness", "claude-code", "codex", "cursor", "agents-md", "claude-md", "coding-agent", "model-context-protocol", "x402", "gitology", "knowledge-graph", "ontology", "anti-patterns", "deprecated-code", "code-health", "context-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
loreto-mcp = "loreto_mcp.server:main"

[project.urls]
Homepage = "https://loreto.io"
Pricing = "https://loreto.io/pricing"
Gitology = "https://loreto.io/gitology"
Repository = "https://github.com/kopias/loreto-mcp"

[tool.hatch.build.targets.wheel]
packages = ["loreto_mcp"]
