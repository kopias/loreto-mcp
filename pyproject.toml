[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loreto-mcp"
version = "1.0.0"
description = "MCP server for Loreto: read a repository's git history for the conventions its team never wrote down, and install them as a harness for Claude Code, Codex, Muse Code, OpenCode, Hermes or Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["loreto", "mcp", "harness", "claude-code", "codex", "cursor", "agents-md", "claude-md", "coding-agent", "model-context-protocol", "x402"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
loreto-mcp = "loreto_mcp.server:main"

[project.urls]
Homepage = "https://loreto.io"
Pricing = "https://loreto.io/pricing"
Repository = "https://github.com/kopias/loreto-mcp"

[tool.hatch.build.targets.wheel]
packages = ["loreto_mcp"]
